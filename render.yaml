services:
  - type: web
    name: medsafeai-backend
    env: python
    region: oregon
    plan: standard
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python main.py
    routes:
      - path: /
        destination: http://localhost:8000
    healthCheckPath: /health

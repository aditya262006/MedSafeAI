services:
  - type: web
    name: medsafeai-backend
    env: python
    region: oregon
    plan: standard
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    routes:
      - path: /
        destination: http://localhost:8000
    healthCheckPath: /health
